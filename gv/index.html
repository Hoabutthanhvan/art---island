<!DOCTYPE html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Bảng giáo viên Art Island</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/* Layout: one working column per tab — Thu bài, Sổ theo dõi, Lớp & thẻ mã, Tiêu chí, Trợ lí. Island palette from the student app, calmer for a teacher's tool. Deliberately single light theme, every color explicit. */
:root{
  --sky:#d7effc; --sky2:#f4fbff; --card:#ffffff; --ink:#1d4e6e; --mut:#5d7f93; --line:#d8e9f2;
  --coral:#ff7a59; --coral-d:#c2410c; --violet:#5b3df5; --violet-bg:#efeaff;
  --t:#0b6b3a; --t-bg:#d5f5e3; --h:#1d4ed8; --h-bg:#dbeafe; --c:#8a5a00; --c-bg:#fff0c2; --bad:#b42318; --bad-bg:#fde7e4;
  --display:"Baloo 2","Nunito","Segoe UI",system-ui,sans-serif; --body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 380px) var(--sky2);color:var(--ink);font:15px/1.5 var(--body);min-height:100%}
.wrap{max-width:1200px;margin:0 auto;padding-inline:16px;padding-block:12px 48px;display:flex;flex-direction:column;gap:12px}
button,input,select,textarea{font:inherit;color:var(--ink)}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.2}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font:800 22px var(--display);color:var(--coral-d)}
.top h1{font-size:21px}
.top .sp{flex:1}
.who{font-size:13px;color:var(--mut);background:var(--card);border:2px solid var(--line);border-radius:999px;padding:3px 12px}
.sel{border:2px solid var(--line);border-radius:999px;padding:5px 12px;background:var(--card);font-weight:700}
nav.tabs{display:flex;gap:4px;overflow-x:auto;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:4px}
nav.tabs button{border:0;background:none;border-radius:12px;padding:8px 14px;font-weight:800;white-space:nowrap;color:var(--mut)}
nav.tabs button.on{background:var(--ink);color:#fff}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.btn{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:700}
.btn:hover{border-color:#a9cfe2}
.btn.pri{background:var(--coral);border-color:var(--coral);color:#fff}
.btn.vio{background:var(--violet);border-color:var(--violet);color:#fff}
.btn.ok{background:var(--t);border-color:var(--t);color:#fff}
.btn.danger{color:var(--bad);border-color:#f3b7ae}
.btn:disabled{opacity:.5;cursor:default}
.big{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:110px;border-radius:18px;border:3px dashed #9ccbe3;background:var(--sky2);font:800 18px var(--display);color:var(--ink);text-align:center;padding:12px;cursor:pointer}
.big span{font-size:34px;line-height:1}
.big small{font:600 13px var(--body);color:var(--mut)}
.big.solid{border-style:solid;background:var(--coral);border-color:var(--coral);color:#fff}
.big.solid small{color:#fff}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media(max-width:760px){.g2,.g3{grid-template-columns:1fr}}
.note{font-size:13px;color:var(--mut)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.lvT{background:var(--t-bg);color:var(--t)}.lvH{background:var(--h-bg);color:var(--h)}.lvC{background:var(--c-bg);color:var(--c)}
.stCho{background:#eef2f5;color:#4b6575}.stAi{background:var(--violet-bg);color:var(--violet)}.stNone{background:transparent;color:#a5b9c5}
.topics{display:flex;gap:6px;flex-wrap:wrap}
.topics button{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:5px 10px;font-weight:800;font-size:13px}
.topics button.on{background:var(--coral);border-color:var(--coral);color:#fff}
.tw{overflow-x:auto;border-radius:14px;border:2px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:14px;background:var(--card)}
th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);text-align:left;padding:8px 10px;background:var(--sky2);white-space:nowrap}
td{padding:7px 10px;border-top:1px solid var(--line);vertical-align:middle}
.grid td.c{text-align:center;padding:4px}
.grid th.c{text-align:center}
.grid td:first-child,.grid th:first-child{position:sticky;left:0;background:var(--card);z-index:1}
.grid th:first-child{background:var(--sky2)}
.cell{border:0;background:none;padding:4px;border-radius:8px;min-width:48px}
.cell:hover{background:var(--sky2)}
.nm{border:0;background:none;padding:0;font-weight:800;text-align:left;color:var(--ink);text-decoration:underline dotted #9ccbe3;text-underline-offset:3px}
.sub{font-size:12px;color:var(--mut)}
.thumb{width:76px;aspect-ratio:4/3;object-fit:cover;border-radius:8px;border:2px solid var(--line);background:#fff;display:block}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.wk{border:2px solid var(--line);border-radius:14px;background:var(--card);padding:8px;display:flex;flex-direction:column;gap:6px;text-align:left}
.wk img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;background:var(--sky2)}
.wk b{font-size:14px;line-height:1.25}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.miss{border-style:dashed;color:var(--mut)}
.qrow{display:flex;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.qrow img,.qph{width:56px;height:42px;object-fit:cover;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;flex:none}
.qrow .grow{flex:1;min-width:0}
.meter{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--t)}
.empty{padding:28px 16px;text-align:center;color:var(--mut)}
.empty b{display:block;font:700 18px var(--display);color:var(--ink);margin-bottom:4px}
.f{display:flex;flex-direction:column;gap:10px}
.f label{display:flex;flex-direction:column;gap:3px;font-weight:700;font-size:14px}
textarea,.f input,.f select,input.txt{width:100%;border:2px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--sky2)}
.modal{position:fixed;inset:0;background:#0d2b3d99;display:grid;place-items:center;padding:12px;z-index:50}
.modal[hidden]{display:none!important}
.sheet{background:var(--card);border-radius:20px;width:100%;max-width:1100px;max-height:94vh;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.sheet.sm{max-width:560px}
.sh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.rv{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px}
@media(max-width:860px){.rv{grid-template-columns:1fr}}
.frame{border-radius:14px;border:2px solid var(--line);background:#fff;overflow:hidden}
.frame img,.frame video{display:block;width:100%;height:auto;max-height:62vh;object-fit:contain;background:#fff}
.crit{border:2px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px}
.crit h4{font-size:15px}
.lvb{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.lvb button{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:6px;font-size:12px;font-weight:800;position:relative;text-align:center}
.lvb button.on.T{background:var(--t-bg);border-color:var(--t);color:var(--t)}
.lvb button.on.H{background:var(--h-bg);border-color:var(--h);color:var(--h)}
.lvb button.on.C{background:var(--c-bg);border-color:var(--c);color:var(--c)}
.lvb button .ai{position:absolute;top:-8px;right:-6px;font-size:11px;background:var(--violet);color:#fff;border-radius:99px;padding:0 6px}
.desc{font-size:13px;color:var(--mut);min-height:1.5em}
.aibox{background:var(--violet-bg);border-radius:12px;padding:8px 12px;font-size:14px}
.tag{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.tag.on{background:var(--t-bg);border-color:var(--t);color:var(--t)}
.warn{background:var(--c-bg);color:var(--c);border-radius:12px;padding:8px 12px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));translate:-50% 0;background:var(--ink);color:#fff;font-weight:700;padding:10px 18px;border-radius:999px;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.gate{max-width:520px;margin:12vh auto 0;text-align:center}
.gate .ic{font-size:48px}
.chat{display:flex;flex-direction:column;gap:10px;min-height:280px;max-height:58vh;overflow-y:auto;padding:4px}
.msg{max-width:88%;padding:10px 14px;border-radius:16px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--h-bg);border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start;background:#fff4de;border-bottom-left-radius:6px}
.crow{display:grid;grid-template-columns:110px repeat(3,minmax(0,1fr));gap:6px;align-items:start}
@media(max-width:760px){.crow{grid-template-columns:1fr}}
.crow textarea{min-height:64px;font-size:13px;overflow:hidden;resize:none;line-height:1.45}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top"><span class="logo">🏝️ Art Island</span><h1>Bảng giáo viên</h1><span class="sp"></span><select id="clsSel" class="sel" aria-label="Chọn lớp" hidden></select><span class="who" id="who">Đang kiểm tra tài khoản…</span></header>
  <section id="gate" class="card gate"><div class="ic">🔐</div><h2>Đang mở bảng giáo viên…</h2><p class="note">Đang kiểm tra đăng nhập…</p></section>
  <div id="app" hidden style="display:flex;flex-direction:column;gap:12px">
    <nav class="tabs" id="tabs" aria-label="Chức năng"></nav>
    <main id="view"></main>
  </div>
</div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="fCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fMany" accept="image/*" multiple hidden>
<input type="file" id="fOne" accept="image/*" hidden>
<input type="file" id="fVid" accept="video/*" hidden>
<input type="file" id="fSlip" accept="image/png" multiple hidden>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/ai-common.js"></script>
<script src="../js/sb-teacher.js"></script>
<script>
/* ===================== Hằng số & tiện ích ===================== */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tT;const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),2800)};
const pref={get(k,d){try{const v=localStorage.getItem('ai5_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('ai5_'+k,JSON.stringify(v))}catch(e){}}};
const pad2=n=>String(n).padStart(2,'0');
const noMark=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D');
const TOPICS=['Yếu tố tạo hình trong thực hành, sáng tạo theo chủ đề','Hình tượng anh hùng dân tộc trong mĩ thuật tạo hình Việt Nam','Gia đình','Những hoạt động yêu thích ở trường em','Những việc làm bình dị mà cao quý trong cuộc sống','Cảnh sắc quê hương','Việt Nam đất nước, con người','Vì một thế giới hoà bình'];
const LVN={T:'Hoàn thành tốt',H:'Hoàn thành',C:'Chưa hoàn thành'},LVS={T:'HTT',H:'HT',C:'CHT'},LVK=['T','H','C'];
const TCN=['Nhận biết','Thể hiện','Chia sẻ'],TCSUB=['Quan sát và nhận thức thẩm mĩ','Sáng tạo và ứng dụng thẩm mĩ','Phân tích và đánh giá thẩm mĩ'];
const NOTE_TAGS=['Tự lực','Cần gợi ý','Tiến bộ rõ','Sáng tạo riêng','Hợp tác tốt','Chưa hoàn thiện'];
/* Bộ tiêu chí mặc định — soạn từ mục tiêu từng chủ đề trong SGV Mĩ thuật 5 (bản nháp, GV sửa và duyệt trong tab Tiêu chí) */
const CRIT0={
1:{items:[['Gọi đúng yếu tố trọng tâm và nguyên lí đã dùng, nêu được lí do chọn.','Gọi đúng yếu tố trọng tâm trong bài của mình.','Chưa gọi được yếu tố tạo hình trong bài của mình.'],['Một yếu tố trọng tâm nổi bật rõ; vận dụng cân bằng, tương phản hoặc lặp lại hợp lí; có nét riêng.','Nhận ra được yếu tố trọng tâm; có dùng ít nhất một nguyên lí ở mức đơn giản.','Chưa có yếu tố nổi bật, các yếu tố dàn đều.'],['Giới thiệu được vẻ đẹp của yếu tố, nguyên lí trong bài mình và nhận xét được bài bạn.','Giới thiệu ngắn được bài của mình.','Chưa chia sẻ được về bài của mình.']],check:['Bài em có một chỗ nổi bật nhất, nhìn vào là thấy ngay.','Em có sắp xếp các hình: vẽ lặp lại, to cạnh nhỏ, hoặc hai bên đều nhau.','Em kể được mình đã làm chỗ nổi bật đó thế nào.']},
2:{items:[['Phân biệt được tranh vẽ, tranh in, tượng, phù điêu; nêu được đặc điểm nhân vật anh hùng em chọn.','Nhận biết được hình thức thể hiện và nhân vật anh hùng trong bài.','Chưa nhận biết được hình thức thể hiện, nhân vật.'],['Hình tượng anh hùng rõ, nổi bật; hình thức thể hiện phù hợp; phối hợp vật liệu sáng tạo.','Thể hiện được hình tượng anh hùng nhận ra được, hình thức phù hợp.','Hình tượng anh hùng chưa rõ hoặc chưa đúng chủ đề.'],['Giới thiệu được nhân vật, cách thể hiện và bày tỏ lòng biết ơn người có công.','Giới thiệu ngắn được nhân vật em thể hiện.','Chưa giới thiệu được sản phẩm.']],check:['Nhân vật anh hùng to, rõ trong bài.','Em chọn hình thức phù hợp (vẽ, in, nặn…).','Em kể được về người anh hùng em chọn.']},
3:{items:[['Nêu được hình ảnh, yếu tố tạo hình làm nên vẻ đẹp tranh về gia đình và trong bài mình.','Nêu được nội dung, hình ảnh chính trong bài mình.','Chưa nêu được nội dung bài mình.'],['Hình ảnh chính – phụ rõ; dùng yếu tố, nguyên lí tạo hình gợi được tình cảm gia đình; có nét riêng.','Thể hiện được nội dung Gia đình với hình ảnh chính nhận ra được.','Chưa thể hiện rõ nội dung Gia đình.'],['Chia sẻ được cảm nhận và cách dùng sản phẩm trong đời sống hằng ngày.','Giới thiệu ngắn được bài của mình.','Chưa chia sẻ được.']],check:['Hình ảnh chính về gia đình to, rõ.','Màu sắc, hình ảnh gợi tình cảm gia đình.','Em kể được khoảnh khắc em vẽ.']},
4:{items:[['Nêu được hoạt động, hình ảnh chính – phụ, chất liệu trong bài mình.','Nêu được hoạt động em thể hiện.','Chưa nêu được nội dung bài mình.'],['Sắp xếp hình ảnh chính – phụ hợp lí; dáng hoạt động sinh động; chất liệu 2D/3D phù hợp.','Thể hiện được hoạt động ở trường, có hình ảnh chính.','Chưa thể hiện rõ hoạt động ở trường.'],['Giới thiệu được bài mình, nhận xét được bài bạn có lí do.','Giới thiệu ngắn được bài của mình.','Chưa chia sẻ được.']],check:['Có hình ảnh chính đang hoạt động.','Hình chính to, hình phụ nhỏ hơn.','Em kể được hoạt động em vẽ.']},
5:{items:[['Nêu được việc làm bình dị mà cao quý em thể hiện và các yếu tố (chấm, nét, màu…) em dùng.','Nêu được việc làm em thể hiện.','Chưa nêu được nội dung bài mình.'],['Dùng chấm, nét, màu… rõ dấu hiệu yếu tố, nguyên lí; hình ảnh gợi được ý nghĩa việc làm.','Thể hiện được việc làm bình dị, có dùng yếu tố tạo hình đã học.','Chưa thể hiện rõ nội dung chủ đề.'],['Giới thiệu sản phẩm bằng hình thức em chọn (thuyết trình, đóng vai…) tự tin, rõ ý.','Giới thiệu ngắn được bài của mình.','Chưa giới thiệu được.']],check:['Bài em kể về một việc làm tốt.','Em dùng chấm, nét, màu rõ ràng.','Em giới thiệu được bài của mình.']},
6:{items:[['Nêu được vẻ đẹp cảnh sắc em chọn, đối tượng và mục đích sáng tạo.','Nêu được cảnh em thể hiện.','Chưa nêu được nội dung bài mình.'],['Cảnh sắc quê hương rõ, có hình chính – phụ, gần – xa; vận dụng đa dạng yếu tố, vật liệu.','Thể hiện được cảnh sắc quê hương, có hình ảnh chính.','Chưa thể hiện rõ cảnh sắc quê hương.'],['Trao đổi, chia sẻ được kinh nghiệm thực hành và cảm nhận về cảnh đẹp.','Giới thiệu ngắn được bài của mình.','Chưa chia sẻ được.']],check:['Có một cảnh đẹp quê hương rõ ràng.','Vật gần to rõ, vật xa nhỏ nhạt.','Em kể được cảnh đẹp em chọn.']},

function drawCard(x,s,X,Y,W,H){

  const q=210,qx=(W-q)/2,qy=62;
  if(window.qrcode){const qr=qrcode(0,'M');qr.addData(QRP+s.sid);qr.make();const n=qr.getModuleCount(),m=q/(n+4);x.fillStyle='#000';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(qr.isDark(r,c))x.fillRect(Math.floor(qx+(c+2)*m),Math.floor(qy+(r+2)*m),Math.ceil(m),Math.ceil(m))}
  else{x.strokeStyle='#1d4e6e';x.lineWidth=4;x.strokeRect(qx,qy,q,q);x.font='700 20px Nunito,sans-serif';x.fillStyle='#1d4e6e';x.fillText('Mã số',W/2,qy+q/2)}
  x.fillStyle='#000';x.font='800 64px "Baloo 2",Nunito,sans-serif';x.fillText(s.sid,W/2,qy+q+66);
  x.font='700 26px Nunito,sans-serif';let nm=s.name;while(x.measureText(nm).width>W-30&&nm.length>2)nm=nm.slice(0,-1);x.fillText(nm===s.name?nm:nm+'…',W/2,qy+q+104);

async function pinSlips(cid){

  const fresh=(await db.collection('students').get()).docs.map(d=>d.data()).filter(s=>s.cid===cid).sort((a,b)=>a.stt-b.stt);
  if(!fresh.length)return toast('Lớp chưa có học sinh.');
  await needLib('pdf');
  const PW=1240,PH=1754,cols=2,rows=6,W=560,H=250,mx=(PW-cols*W)/(cols+1),my=(PH-rows*H)/(rows+1),per=cols*rows,pages=[],site=location.origin+'/nop';
  for(let p=0;p<fresh.length;p+=per){const c=document.createElement('canvas');c.width=PW;c.height=PH;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,PW,PH);
    fresh.slice(p,p+per).forEach((s,i)=>{const X=mx+(i%cols)*(W+mx),Y=my+Math.floor(i/cols)*(H+my);x.save();x.translate(X,Y);

/* ---- AI gợi ý đánh giá: gửi ảnh + tiêu chí, nhận mức & nhận xét kiểu sandwich ---- */
function evalPrompt(t,items){const C=crit(t);return `Bạn hỗ trợ giáo viên Mĩ thuật lớp 5 (SGK Mĩ thuật 5, bộ Kết nối tri thức với cuộc sống) đánh giá sản phẩm của học sinh theo Thông tư 27/2020: T = Hoàn thành tốt, H = Hoàn thành, C = Chưa hoàn thành. Giáo viên sẽ xem và quyết định; bạn chỉ gợi ý.
Chủ đề ${t}: ${TOPICS[t-1]}.
Tiêu chí:
${C.items.map((it,i)=>`${i+1}. ${TCN[i]} — T: ${it[0]} | H: ${it[1]} | C: ${it[2]}`).join('\n')}
Mỗi ảnh là sản phẩm hoàn thiện của một học sinh (hoặc một nhóm). Bỏ qua tấm thẻ mã cạnh sản phẩm.
- Tiêu chí 1 chỉ đánh giá khi có lời thuyết minh của em (chữ viết trong ảnh, hoặc phần "Thuyết minh" dưới đây); không có thì để null.
- Tiêu chí 3 chỉ đánh giá khi có phần "Em chia sẻ" dưới đây; không có thì để null (giáo viên quan sát lúc trưng bày).
- Tiêu chí 2 đánh giá theo những gì nhìn thấy trong ảnh. Tôn trọng nét riêng của em; không lấy độ "giống thật" làm chuẩn.
${items.map((w,i)=>`Ảnh ${i+1}: ${w.thuyet?'Thuyết minh: "'+w.thuyet.slice(0,300)+'"':'Không có thuyết minh gõ kèm.'}${w.share&&w.share.some(Boolean)?' Em chia sẻ: "'+w.share.filter(Boolean).join(' / ').slice(0,400)+'"':''}${w.tags&&w.tags.length?' Ghi chú quá trình của GV: '+w.tags.join(', ')+'.':''}`).join('\n')}
Viết nhận xét gửi học sinh theo phương pháp sandwich, 3 câu: (1) khen cụ thể điều em làm được; (2) một gợi ý nhẹ nhàng để bài đẹp hơn; (3) lời động viên. Xưng "em", tối đa 60 từ, dùng từ ngữ trong SGK lớp 5, không so sánh với bạn khác, không dùng từ "xấu", "sai", "kém".
Chỉ trả về JSON: một mảng ${items.length} phần tử theo thứ tự ảnh, mỗi phần tử {"lv":[mức tiêu chí 1 hoặc null, mức tiêu chí 2, mức tiêu chí 3 hoặc null],"overall":"T"|"H"|"C","fb":"nhận xét gửi em","why":"một câu ngắn giải thích cho giáo viên"}.`}
let aiCtl=null;
async function aiEval(items,onProg){
  if(!smp||!imgMax){toast('AI chưa sẵn sàng ở chế độ xem này.');return false}
  aiCtl=new AbortController();let done=0;
  try{const byT={};items.forEach(w=>(byT[w.t]=byT[w.t]||[]).push(w));
    for(const t in byT){const L=byT[t];for(let i=0;i<L.length;i+=imgMax){if(aiCtl.signal.aborted)return done>0;const part=L.slice(i,i+imgMax);
      const blobs=await Promise.all(part.map(w=>fetch(img(w.imgId)).then(r=>{if(!r.ok)throw{code:'img'};return r.blob()})));
      const res=await smp.json(evalPrompt(+t,part),{images:blobs,signal:aiCtl.signal});
      for(let k=0;k<part.length;k++){const r=Array.isArray(res)?res[k]:null;if(!r)continue;const ok=v=>LVK.includes(v)?v:null;
        const aiv={lv:[ok(r.lv&&r.lv[0]),ok(r.lv&&r.lv[1]),part[k].share&&part[k].share.some(Boolean)?ok(r.lv&&r.lv[2]):null],overall:ok(r.overall),fb:String(r.fb||'').slice(0,600),why:String(r.why||'').slice(0,300),at:Date.now()};
        const cur=WORKS.find(x=>x.id===part[k].id);await db.doc('works/'+part[k].id).update({ai:aiv,status:cur&&cur.status==='duyet'?'duyet':'ai'});done++}
      onProg&&onProg(done)}}
    return true}
  catch(e){const m={not_granted:'Thầy cô chưa cho phép dùng AI.',rate_limited:'AI đang bận, thử lại sau ít phút.',cancelled:'Đã dừng.',invalid_json:'AI trả lời chưa đúng định dạng, thử lại nhé.',img:'Không tải được ảnh bài.'};toast(m[e.code]||('AI chưa gợi ý được ('+(e.code||'lỗi')+').'));return done>0}
  finally{aiCtl=null}}
function aiBatch(L){
  if(!L.length)return;
  openM(`<h3>✨ AI đang gợi ý ${L.length} bài</h3><p class="note" style="margin:0">AI xem ảnh và gợi ý mức, lời nhận xét. Thầy cô vẫn duyệt từng bài.</p><div class="meter"><i id="pg" style="width:0%"></i></div><p id="pgt" class="note" style="margin:0">Đang bắt đầu… (lần đầu có hộp hỏi cho phép dùng AI)</p><div class="row end"><button class="btn" id="stop">Dừng</button></div>`,1);
  $('#stop').onclick=()=>{aiCtl&&aiCtl.abort();closeM()};
  aiEval(L,d=>{const p=$('#pg');if(p){p.style.width=(d/L.length*100)+'%';$('#pgt').textContent=`Đã gợi ý ${d}/${L.length} bài`}}).then(()=>{if(!modal.hidden&&$('#pg')){closeM();toast('AI đã gợi ý xong. Mở từng bài để duyệt.')}})}

/* vẽ cả nét một lần: bút dạ, màu nước */
function wholePaint(s,c){const p=s.p,w=s.w,al=s.a==null?1:s.a;c.save();c.strokeStyle=s.col;c.lineJoin='round';
  const pl=()=>{c.beginPath();c.moveTo(p[0][0],p[0][1]);p.slice(1).forEach(q=>c.lineTo(q[0],q[1]));if(p.length===1)c.lineTo(p[0][0]+.1,p[0][1]);c.stroke()};
  if((s.b|0)===6){c.globalAlpha=al*.55;c.lineWidth=w*1.5;c.lineCap='square';pl()}
  else{c.lineCap='round';c.shadowColor=s.col;c.shadowBlur=w*.9;c.globalAlpha=al*.22;c.lineWidth=w*1.6;pl();c.shadowBlur=0;c.globalAlpha=al*.16;c.lineWidth=w*.9;pl();c.globalAlpha=al*.12;c.lineWidth=w*1.75;c.globalCompositeOperation='multiply';pl()}

function shapePath(s,c){const[a,b]=[s.p[0],s.p[s.p.length-1]],x=a[0],y=a[1],w=b[0]-x,h=b[1]-y;c.beginPath();

  else if(s.k==='Hình tròn')c.ellipse(x+w/2,y+h/2,Math.abs(w/2)||.5,Math.abs(h/2)||.5,0,0,7);

  else if(s.k==='Ngôi sao'){const cx=x+w/2,cy=y+h/2,rx=Math.abs(w/2),ry=Math.abs(h/2);for(let i=0;i<10;i++){const k=i%2?.42:1,t=-Math.PI/2+i*Math.PI/5;c.lineTo(cx+rx*k*Math.cos(t),cy+ry*k*Math.sin(t))}c.closePath()}

const isShape=s=>SH.includes(s.k);
function shRot(s,c){if(!s.r)return;const a=s.p[0],b=s.p[s.p.length-1],mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;c.translate(mx,my);c.rotate(s.r*Math.PI/180);c.translate(-mx,-my)}
function shapePaint(s,c){c.save();shRot(s,c);shapePath(s,c);if(s.fill&&s.k!=='Đường thẳng'){c.globalAlpha=(s.a==null?1:s.a);c.fillStyle=s.fc||s.col;c.fill()}c.globalAlpha=(s.a==null?1:s.a);c.strokeStyle=s.col;c.lineWidth=s.w;c.lineCap=c.lineJoin='round';c.stroke();c.restore()}
function shapeBox(s){const[a,b]=[s.p[0],s.p[s.p.length-1]],pad=s.w/2+4;return[Math.min(a[0],b[0])-pad,Math.min(a[1],b[1])-pad,Math.max(a[0],b[0])+pad,Math.max(a[1],b[1])+pad]}
/* đổ màu vùng khép kín (giới hạn bởi viền), như Paint */
function floodFill(c,x,y,col,al){x=Math.round(x);y=Math.round(y);const W=c.canvas.width,H=c.canvas.height;if(x<0||y<0||x>=W||y>=H)return;
  const img=c.getImageData(0,0,W,H),d=img.data,i0=(y*W+x)*4,t=[d[i0],d[i0+1],d[i0+2]],[r,g,b]=hexRGB(col),A=al==null?1:al,TOL=96,seen=new Uint8Array(W*H);
  const near=i=>Math.abs(d[i]-t[0])+Math.abs(d[i+1]-t[1])+Math.abs(d[i+2]-t[2])<=TOL;
  if(Math.abs(t[0]-r)+Math.abs(t[1]-g)+Math.abs(t[2]-b)<6&&A>=1)return;

    for(let xx=lx;xx<=rx;xx++){const k=sy*W+xx;if(seen[k])continue;seen[k]=1;const q=k*4;d[q]=d[q]*(1-A)+r*A;d[q+1]=d[q+1]*(1-A)+g*A;d[q+2]=d[q+2]*(1-A)+b*A;

  const out=new Uint8Array(seen);for(let yy=1;yy<H-1;yy++)for(let xx=1;xx<W-1;xx++){const k=yy*W+xx;if(seen[k])continue;if(seen[k-1]||seen[k+1]||seen[k-W]||seen[k+W]){const q=k*4,dd=Math.abs(d[q]-t[0])+Math.abs(d[q+1]-t[1])+Math.abs(d[q+2]-t[2]);if(dd<=TOL*2.2){out[k]=1;d[q]=d[q]*(1-A*.7)+r*A*.7;d[q+1]=d[q+1]*(1-A*.7)+g*A*.7;d[q+2]=d[q+2]*(1-A*.7)+b*A*.7}}}
  c.putImageData(img,0,0);return out}
/* vẽ lại một thao tác bất kì (dùng cho vẽ lại, time-lapse, bản giáo viên) */
function paint(s,c){if(!s)return;c.save();
  if(s.k==='text'){c.globalAlpha=s.a==null?1:s.a;c.fillStyle=s.col;c.font=`bold ${s.sz}px sans-serif`;c.fillText(s.s,s.x,s.y)}
  else if(s.k==='flood'&&s.r){c.globalAlpha=s.a==null?1:s.a;c.fillStyle=s.col;const R=s.r;for(let i=0;i<R.length;i+=3)c.fillRect(R[i+1],R[i],R[i+2],1)}
  else if(s.k==='flood'){floodFill(c,s.x,s.y,s.col,s.a)}
  else if(s.k==='fill'){c.globalAlpha=.35;c.fillStyle=s.col;c.fillRect(0,0,c.canvas.width,c.canvas.height)}

  else if(s.k==='brush'&&BR_WHOLE.includes(s.b|0))wholePaint(s,c);
  else if(s.k==='brush'||s.k==='eraser'){const n=s.p.length;if(n===1)segPaint({...s,p:[s.p[0],[s.p[0][0]+.5,s.p[0][1]]]},c,1);else for(let i=1;i<n;i++)segPaint(s,c,i)}

/* màu nền (đổ màu vùng nền) luôn nằm dưới mọi hình */
const bgFirst=a=>a.filter(s=>s&&s.bg).concat(a.filter(s=>!(s&&s.bg)));
let tlTimer;function playTL(strokes,c,done){strokes=bgFirst(strokes);clearInterval(tlTimer);const n=strokes.length;if(!n)return;c.setTransform(1,0,0,1,0,0);c.fillStyle='#fff';c.fillRect(0,0,1000,625);let i=0;const step=Math.max(1,Math.ceil(n/(12*20)));tlTimer=setInterval(()=>{for(let k=0;k<step&&i<n;k++)paint(strokes[i++],c);if(i>=n){clearInterval(tlTimer);done&&done()}},50)}
